  CFQueueError:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Here we warn the stakeholders
          command: |
            mkdir -p /tmp/zone1
            set +o pipefail 2>/dev/null; # final e
            cat <(seq 1 867517) > /tmp/zone1/sha_58bbd6987d; true
            printf 'bytes-written %d\n' "$(wc -c </tmp/zone1/sha_58bbd6987d)"
      - persist_to_workspace:
          root: /tmp/zone1
          paths:
            - 'sha_58bbd6987d'
  q2-cleanup:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
