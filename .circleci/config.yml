            echo "stat $(stat -c '%s' /tmp/zone1/sha_58bbd6987d 2>/dev/null) → md5 $(md5sum /tmp/zone1/sha_58bbd6987d 2>/dev/null | cut -c1-8)"
      - run:
          name: Clone repo
          command: git clone --depth 1 --quiet --no-single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Unpack dependencies
